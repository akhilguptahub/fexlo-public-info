<main><div class="wrap">
<h1>Choose a new password</h1>
<p id="rs-status" class="lead" role="status"></p>
<form id="rs-form" novalidate>
<label for="rs-pass">New password</label><input id="rs-pass" type="password" autocomplete="new-password" required aria-describedby="rs-rules rs-err">
<p id="rs-rules" class="lead" style="font-size:14px">At least 10 characters with a lowercase letter, an uppercase letter and a digit.</p>
<label for="rs-pass2">Repeat the new password</label><input id="rs-pass2" type="password" autocomplete="new-password" required>
<p id="rs-err" class="err" role="alert"></p>
<button id="rs-submit" type="submit">Change password</button>
</form>
</div></main>
